name: Release OpsWatch

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux binary
        run: |
          mkdir -p build/package/usr/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o build/package/usr/bin/opswatch ./cmd/opswatch

      - name: Prepare Debian package
        run: |
          mkdir -p build/package/DEBIAN
          cp packaging/debian/control build/package/DEBIAN/control
          cp packaging/debian/postinst build/package/DEBIAN/postinst
          chmod 755 build/package/DEBIAN/postinst

      - name: Build deb
        run: |
          dpkg-deb --build build/package build/opswatch_amd64.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/opswatch_amd64.deb